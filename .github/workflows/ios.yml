name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  test:
    name: Unit Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: xcodebuild -version && swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available \
            | sed -nE 's/^[[:space:]]*(iPhone.*[^[:space:]]) \([0-9A-F-]{36}\) \([A-Za-z]+\)[[:space:]]*$/\1/p' \
            | head -1)
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "simulator: $DEVICE"
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test -project FFCamera.xcodeproj -scheme FFCamera \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -quiet 2>&1 | tee test.log
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          if-no-files-found: ignore

  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project FFCamera.xcodeproj -scheme FFCamera \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet 2>&1 | tee build.log
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
      - name: Package unsigned IPA
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/FFCamera.app
          test -d "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry FFCamera-unsigned.ipa Payload
          unzip -l FFCamera-unsigned.ipa | head -20
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FFCamera-unsigned-ipa
          path: out/FFCamera-unsigned.ipa

  release:
    name: Attach IPA to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FFCamera-unsigned-ipa
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/FFCamera-unsigned.ipa
          generate_release_notes: true
