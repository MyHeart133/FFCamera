name: FFCamera
options:
  bundleIdPrefix: com.ffcamera
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: "3"
    MARKETING_VERSION: "0.3.1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  FFCamera:
    type: application
    platform: iOS
    sources:
      - path: FFCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ffcamera.app
        PRODUCT_NAME: FFCamera
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: FFCamera
        INFOPLIST_KEY_NSCameraUsageDescription: "FFCamera 需要使用相机完成拍摄与 AI 构图"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "FFCamera 需要将照片保存到相册"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "FFCamera 需要访问相册以管理你的照片"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      configs:
        Debug:
          ENABLE_TESTABILITY: "YES"
  FFCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FFCameraTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.ffcamera.app.tests
    dependencies:
      - target: FFCamera

schemes:
  FFCamera:
    build:
      targets:
        FFCamera: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FFCameraTests
